<svg xmlns="http://www.w3.org/2000/svg" height="40" width="40" viewBox="0 0 40 40"><!-- The glyph is an iOS-style back chevron: Qt's original draws it hugging the LEFT of its 40x40 box (art spans x 1.125-18.146, centre 9.64, against a box centre of 20), because Material Symbols' `arrow_back_ios` is designed to sit beside a label rather than alone. Every use here centres it in a square button instead, where that built-in offset reads as a mis-centred arrow. The translate re-centres the artwork inside the same box: the path, the scale and the viewBox are byte-identical to Qt's, so the two products still draw the same glyph at the same size. See docs/architecture/icons.md. --><g transform="translate(10.3645,0)"><path fill="#ffffff" d="M15.625 35.042 1.5 20.917q-.208-.209-.292-.438-.083-.229-.083-.479 0-.25.083-.479.084-.229.292-.438L15.667 4.917q.416-.417 1-.417.583 0 1.041.458.417.417.417 1.021 0 .604-.417 1.063L4.708 20l13 13q.459.417.438 1.021-.021.604-.438 1.021-.458.416-1.062.416-.604 0-1.021-.416Z"/></g></svg>
